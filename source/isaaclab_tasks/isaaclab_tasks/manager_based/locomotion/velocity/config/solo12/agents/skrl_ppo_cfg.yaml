seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: True
  policy:  # see gaussian_model parameters
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [512,256,256,128]
        activations: selu
    output: ACTIONS
  value:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [512,256,256,128]
        activations: selu
    output: ONE


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  # 🟩 New Mixed Precision -- faster training
  mixed_precision: True
  class: PPO
  rollouts: 256
  time_limit_bootstrap: True # setting true, since we have short episodes frequently truncated
  learning_epochs: 10
  mini_batches: 8 # Bi=1024

  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 3.0e-04
  # 🟩 New Adaptive LR based on KL
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01     # target KL (tune 0.008–0.02)
    min_lr: 3.0e-5
    max_lr: 8.0e-4
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null

  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null

  random_timesteps: 0
  learning_starts: 0

  grad_norm_clip: 0.5
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True

  entropy_loss_scale: 0.001   # 🟩 New  - common starting range: 1e-4 to 1e-2
  value_loss_scale: 0.5

  kl_threshold: 0.03 # use as PPO early-stop threshold -- stops updating if KL divergence between old and new policy exceeds this value
  rewards_shaper_scale: 1.0
  


  # logging and checkpoint
  experiment:
    directory: "borinot_ppo_experiments"
    experiment_name: "0318_"
    write_interval: 12800 
    checkpoint_interval: 50000
    wandb: True
    wandb_kwargs:
      project: "borinotIsaacLab"
      entity: "jordibelp"
      name: "0318: Solo12 linear_vel, angular_vel cmds"
      sync_tensorboard: true

# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 2916667  #  10 million steps; 10_000_000 / 64
  environment_info: log
  